```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIM Photos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 400;
        }

        header p {
            margin: 8px 0 0;
            color: #999;
            font-size: 14px;
        }

        .gallery {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #222;
            border-radius: 4px;
            cursor: pointer;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo:hover img {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 13px;
        }

        /* VISOR */

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 42px;
            font-weight: 300;
            color: #fff;
            cursor: pointer;
            line-height: 1;
            z-index: 2;
        }

        .close:hover {
            color: #aaa;
        }

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            font-weight: 300;
            color: #fff;
            cursor: pointer;
            user-select: none;
            z-index: 2;
            padding: 20px;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .prev:hover,
        .next:hover {
            color: #aaa;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px;
                gap: 8px;
            }

            .prev,
            .next {
                font-size: 36px;
                padding: 10px;
            }

            .close {
                top: 15px;
                right: 20px;
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>KIM Photos</h1>
        <p>Personal photo collection</p>
    </header>

    <main class="gallery">

        <div class="photo" onclick="openLightbox(0)">
            <img
                src="images/IMG-20220822-WA0034.jpg"
                alt="Fotografía 1"
            >
        </div>

        <div class="photo" onclick="openLightbox(1)">
            <img
                src="images/FB_IMG_1661210151519.jpg"
                alt="Fotografía 2"
            >
        </div>

    </main>

    <footer>
        © KIM Solutions
    </footer>

    <!-- VISOR -->

    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <span class="prev" onclick="previousPhoto()">&#10094;</span>

        <img id="lightboxImage" src="" alt="Fotografía ampliada">

        <span class="next" onclick="nextPhoto()">&#10095;</span>

    </div>

    <script>

        const photos = [
            "images/IMG-20220822-WA0034.jpg",
            "images/FB_IMG_1661210151519.jpg"
        ];

        let currentPhoto = 0;

        function openLightbox(index) {
            currentPhoto = index;

            document.getElementById("lightboxImage").src =
                photos[currentPhoto];

            document.getElementById("lightbox").classList.add("active");
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
        }

        function previousPhoto() {
            currentPhoto--;

            if (currentPhoto < 0) {
                currentPhoto = photos.length - 1;
            }

            document.getElementById("lightboxImage").src =
                photos[currentPhoto];
        }

        function nextPhoto() {
            currentPhoto++;

            if (currentPhoto >= photos.length) {
                currentPhoto = 0;
            }

            document.getElementById("lightboxImage").src =
                photos[currentPhoto];
        }

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeLightbox();
            }

            if (event.key === "ArrowLeft") {
                previousPhoto();
            }

            if (event.key === "ArrowRight") {
                nextPhoto();
            }

        });

    </script>

</body>
</html>
```
