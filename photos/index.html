```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIM Photos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 400;
        }

        header p {
            margin: 8px 0 0;
            color: #999;
            font-size: 14px;
        }

        .gallery {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #222;
            border-radius: 4px;
            cursor: pointer;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo:hover img {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 13px;
        }

        /* VISOR */

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 42px;
            font-weight: 300;
            color: #fff;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>KIM Photos</h1>
        <p>Personal photo collection</p>
    </header>

    <main class="gallery">

        <div class="photo" onclick="openLightbox()">
            <img src="images/IMG-20220822-WA0034.jpg" alt="Fotografía">
        </div>

    </main>

    <footer>
        © KIM Solutions
    </footer>

    <!-- VISOR -->

    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <img
            src="images/IMG-20220822-WA0034.jpg"
            alt="Fotografía ampliada"
        >

    </div>

    <script>
        function openLightbox() {
            document.getElementById("lightbox").classList.add("active");
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
```
