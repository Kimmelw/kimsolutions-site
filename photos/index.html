<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIM Photos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ENCABEZADO */

        header {
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 400;
        }

        header p {
            margin: 8px 0 20px;
            color: #999;
            font-size: 14px;
        }

        /* NAVEGACIÓN DE DÉCADAS */

        .decades {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
        }

        .decade-button {
            border: 1px solid #444;
            background: #1b1b1b;
            color: #ccc;
            padding: 9px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .decade-button:hover {
            background: #2a2a2a;
            color: #fff;
        }

        .decade-button.active {
            background: #fff;
            color: #111;
            border-color: #fff;
        }

        /* GALERÍA */

        .gallery {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #222;
            border-radius: 4px;
            cursor: pointer;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo:hover img {
            transform: scale(1.05);
        }

        /* MENSAJE CUANDO NO HAY FOTOS */

        .empty-message {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 15px;
        }

        .empty-message.active {
            display: block;
        }

        /* PIE */

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 13px;
        }

        /* VISOR */

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }

        /* CERRAR */

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 42px;
            font-weight: 300;
            color: #fff;
            cursor: pointer;
            line-height: 1;
            z-index: 2;
        }

        .close:hover {
            color: #aaa;
        }

        /* ANTERIOR / SIGUIENTE */

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            font-weight: 300;
            color: #fff;
            cursor: pointer;
            user-select: none;
            z-index: 2;
            padding: 20px;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .prev:hover,
        .next:hover {
            color: #aaa;
        }

        /* MÓVIL */

        @media (max-width: 600px) {

            header {
                padding: 25px 15px 15px;
            }

            header h1 {
                font-size: 27px;
            }

            .decades {
                gap: 6px;
                padding: 12px 10px;
            }

            .decade-button {
                padding: 8px 12px;
                font-size: 13px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px;
                gap: 8px;
            }

            .prev,
            .next {
                font-size: 36px;
                padding: 10px;
            }

            .close {
                top: 15px;
                right: 20px;
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO -->

    <header>

        <h1>KIM Photos</h1>

        <p id="albumTitle">
            Personal photo collection · 2020s
        </p>

    </header>


    <!-- DÉCADAS -->

    <nav class="decades">

        <button
            class="decade-button"
            onclick="showDecade('all', this)"
        >
            TODAS
        </button>

        <button
            class="decade-button"
            onclick="showDecade('1980s', this)"
        >
            1980s
        </button>

        <button
            class="decade-button"
            onclick="showDecade('1990s', this)"
        >
            1990s
        </button>

        <button
            class="decade-button"
            onclick="showDecade('2000s', this)"
        >
            2000s
        </button>

        <button
            class="decade-button"
            onclick="showDecade('2010s', this)"
        >
            2010s
        </button>

        <button
            class="decade-button active"
            onclick="showDecade('2020s', this)"
        >
            2020s
        </button>

    </nav>


    <!-- GALERÍA -->

    <main class="gallery" id="gallery">

        <!-- 2020s -->

        <div
            class="photo"
            data-decade="2020s"
            onclick="openLightbox(0)"
        >
            <img
                src="images/2020s/IMG-20220822-WA0034.jpg"
                alt="Fotografía 1"
            >
        </div>

        <div
            class="photo"
            data-decade="2020s"
            onclick="openLightbox(1)"
        >
            <img
                src="images/2020s/FB_IMG_1661210151519.jpg"
                alt="Fotografía 2"
            >
        </div>

    </main>


    <!-- MENSAJE SIN FOTOS -->

    <div
        class="empty-message"
        id="emptyMessage"
    >
        No hay fotografías en esta década todavía.
    </div>


    <!-- PIE -->

    <footer>
        © KIM Solutions
    </footer>


    <!-- VISOR -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <span
            class="close"
            onclick="closeLightbox()"
        >
            &times;
        </span>

        <span
            class="prev"
            onclick="previousPhoto()"
        >
            &#10094;
        </span>

        <img
            id="lightboxImage"
            src=""
            alt="Fotografía ampliada"
        >

        <span
            class="next"
            onclick="nextPhoto()"
        >
            &#10095;
        </span>

    </div>


    <script>

        /*
         * FOTOGRAFÍAS
         */

        const photos = [

            {
                src: "images/2020s/IMG-20220822-WA0034.jpg",
                decade: "2020s"
            },

            {
                src: "images/2020s/FB_IMG_1661210151519.jpg",
                decade: "2020s"
            }

        ];


        let currentPhoto = 0;

        let visiblePhotos = photos;


        /*
         * MOSTRAR DÉCADA
         */

        function showDecade(decade, button) {

            const photoElements =
                document.querySelectorAll(".photo");

            visiblePhotos = [];

            photoElements.forEach(function(photoElement, index) {

                const photoDecade =
                    photoElement.dataset.decade;

                if (
                    decade === "all" ||
                    photoDecade === decade
                ) {

                    photoElement.style.display = "block";

                    visiblePhotos.push(
                        photos[index]
                    );

                } else {

                    photoElement.style.display = "none";

                }

            });


            /*
             * BOTÓN ACTIVO
             */

            document
                .querySelectorAll(".decade-button")
                .forEach(function(buttonElement) {

                    buttonElement.classList.remove("active");

                });

            button.classList.add("active");


            /*
             * TÍTULO
             */

            const albumTitle =
                document.getElementById("albumTitle");

            if (decade === "all") {

                albumTitle.textContent =
                    "Personal photo collection · Todas";

            } else {

                albumTitle.textContent =
                    "Personal photo collection · " + decade;

            }


            /*
             * MENSAJE SI NO HAY FOTOS
             */

            const emptyMessage =
                document.getElementById("emptyMessage");

            if (visiblePhotos.length === 0) {

                emptyMessage.classList.add("active");

            } else {

                emptyMessage.classList.remove("active");

            }

        }


        /*
         * ABRIR VISOR
         */

        function openLightbox(index) {

            const selectedPhoto =
                document.querySelectorAll(".photo")[index];

            const allPhotoElements =
                Array.from(
                    document.querySelectorAll(".photo")
                );

            const visibleElements =
                allPhotoElements.filter(function(element) {

                    return element.style.display !== "none";

                });

            const realIndex =
                visibleElements.indexOf(selectedPhoto);

            currentPhoto = realIndex;

            document.getElementById("lightboxImage").src =
                visiblePhotos[currentPhoto].src;

            document
                .getElementById("lightbox")
                .classList.add("active");

        }


        /*
         * CERRAR VISOR
         */

        function closeLightbox() {

            document
                .getElementById("lightbox")
                .classList.remove("active");

        }


        /*
         * FOTO ANTERIOR
         */

        function previousPhoto() {

            if (visiblePhotos.length === 0) {
                return;
            }

            currentPhoto--;

            if (currentPhoto < 0) {

                currentPhoto =
                    visiblePhotos.length - 1;

            }

            document.getElementById("lightboxImage").src =
                visiblePhotos[currentPhoto].src;

        }


        /*
         * FOTO SIGUIENTE
         */

        function nextPhoto() {

            if (visiblePhotos.length === 0) {
                return;
            }

            currentPhoto++;

            if (currentPhoto >= visiblePhotos.length) {

                currentPhoto = 0;

            }

            document.getElementById("lightboxImage").src =
                visiblePhotos[currentPhoto].src;

        }


        /*
         * TECLADO
         */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeLightbox();

                }

                if (event.key === "ArrowLeft") {

                    previousPhoto();

                }

                if (event.key === "ArrowRight") {

                    nextPhoto();

                }

            }
        );


        /*
         * INICIAR EN 2020s
         */

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                const defaultButton =
                    document.querySelector(
                        ".decade-button.active"
                    );

                showDecade(
                    "2020s",
                    defaultButton
                );

            }
        );

    </script>

</body>
</html>
